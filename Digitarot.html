<style>
/* Layout: one column app, max 720px. Controls on top, spread of cards below, short readings under the spread. Night-sky look, same as the tarot guide. */
:root{
  --ink:#12102B; --ink-2:#1F1745; --panel:#1E1A44; --panel-2:#2E2670;
  --gold:#E8C170; --cream:#F4F1EA; --muted:#B9B3D6; --teal:#6FD3C2; --line:rgba(232,193,112,.4);
  --display:'Cormorant Garamond', Georgia, serif; --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--ink); color:var(--cream); font-family:var(--body); font-size:16px; line-height:1.5;
  background-image:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 55%,#2E2062 100%); background-attachment:fixed;
  padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
header{text-align:center; padding-top:8px}
.eyebrow{letter-spacing:.3em; font-size:12px; font-weight:600; color:var(--gold); text-transform:uppercase}
h1{margin:6px 0 0; font-family:var(--display); font-weight:700; font-size:clamp(44px,13vw,64px); line-height:1; text-wrap:balance}
h1 em{font-weight:500; color:var(--gold)}
.tagline{margin:6px 0 0; font-family:var(--display); font-style:italic; font-weight:500; font-size:clamp(20px,5.5vw,26px); color:var(--gold)}
.lead{margin:10px auto 0; max-width:34ch; color:var(--muted); font-size:15px}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:18px; display:flex; flex-direction:column; gap:16px}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.label{font-weight:600; font-size:15px}
.sub{color:var(--muted); font-size:13px}
.stepper{display:flex; align-items:center; gap:6px}
.stepper button{width:46px; height:46px; border-radius:50%; border:2px solid var(--gold); background:transparent; color:var(--gold); font-size:24px; font-weight:600; cursor:pointer; line-height:1}
.stepper button:disabled{opacity:.35; cursor:default}
.stepper output{min-width:56px; text-align:center; font-family:var(--display); font-weight:700; font-size:44px; line-height:1}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{min-width:44px; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--cream); font:600 15px var(--body); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold); color:var(--ink); border-color:var(--gold)}
.switch{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; background:none; border:0; padding:4px 0; color:var(--cream); font:inherit; cursor:pointer; text-align:left; min-height:44px}
.switch .track{flex:none; width:52px; height:30px; border-radius:999px; background:#3A3470; position:relative; transition:background .2s}
.switch .track::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:var(--cream); transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--gold)}
.switch[aria-checked="true"] .track::after{transform:translateX(22px); background:var(--ink)}
.btn{border:0; border-radius:999px; padding:16px 28px; font:600 18px var(--body); cursor:pointer; min-height:54px}
.btn.primary{background:var(--gold); color:var(--ink); width:100%}
.btn.ghost{background:transparent; color:var(--gold); border:2px solid var(--gold); padding:12px 22px; font-size:16px; min-height:48px}
.btn:disabled{opacity:.6; cursor:default}
button:focus-visible{outline:3px solid var(--cream); outline-offset:3px}

.stage{display:flex; flex-direction:column; gap:14px}
.spread{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:20px 12px}
.slot{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; width:100%; max-width:168px; justify-self:center}
.slot .pos{font-weight:600; font-size:14px; color:var(--gold); text-align:center; min-height:20px}
.slot .state{font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--muted); min-height:18px; text-align:center}
.slot .state.rev{color:var(--teal)} .slot .state.up{color:var(--gold)}
.card{width:100%; padding:0; border:0; background:none; cursor:pointer; container-type:inline-size; perspective:900px; display:block}
.inner{position:relative; width:100%; aspect-ratio:2/3; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.back,.face{position:absolute; inset:0; border-radius:10cqw; border:1.8cqw solid var(--gold); backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; display:flex; align-items:center; justify-content:center}
.back{background:#1A1738}
.back::before,.face::before{content:""; position:absolute; inset:4.5cqw; border:.5cqw solid rgba(232,193,112,.4); border-radius:6.5cqw}
.back svg{width:56cqw; height:56cqw}
.face{background:#221D4B; transform:rotateY(180deg)}
.face .content{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:7cqw 7cqw 6.5cqw; gap:1cqw}
.face .num{font-family:var(--display); font-weight:700; font-size:12cqw; line-height:1; color:var(--gold)}
.face.rev .num{color:var(--teal)}
.face.rev .art svg{transform:rotate(180deg)}
.face .art{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center}
.face .art svg{width:100%; height:100%; display:block}
.face .name{font-family:var(--display); font-weight:700; font-size:9.6cqw; line-height:1.05; text-align:center; text-wrap:balance}
.zoom{position:fixed; inset:0; z-index:10; background:rgba(10,8,30,.97); display:flex; align-items:center; justify-content:center; padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y:auto}
.zoom[hidden]{display:none!important}
.zbox{width:min(340px,100%); display:flex; flex-direction:column; align-items:center; gap:14px; margin:auto}
.zoomcard{width:min(260px,66vw); container-type:inline-size}
.zoomcard .face{position:relative; transform:none; width:100%; aspect-ratio:2/3; backface-visibility:visible; -webkit-backface-visibility:visible}
.ztext{text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center}
.ztext .nm{font-family:var(--display); font-weight:700; font-size:28px; line-height:1.1}
.ztext p{margin:0; font-size:15px}
.deal{animation:deal .45s both cubic-bezier(.3,.7,.2,1)}
@keyframes deal{from{opacity:0; transform:translateY(18px) scale(.92)} to{opacity:1; transform:none}}
.sum{margin:14px 0 0; padding:14px; border:1px solid var(--gold); border-radius:16px; background:var(--ink)}
.sum h3{margin:0 0 6px; font-family:var(--display); font-size:22px; color:var(--gold)}
.sum p{margin:0; font-size:16px}
.tip{margin:14px 0 0; padding-top:12px; border-top:1px solid var(--line); color:var(--gold); font-size:15px}
.tools{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

.reading h2{margin:0; font-family:var(--display); font-size:30px; line-height:1.1}
.reading ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.reading li{border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:4px}
.reading .top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.reading .pos{font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.reading .nm{font-family:var(--display); font-weight:700; font-size:26px; line-height:1.1}
.badge{font-size:12px; font-weight:600; border-radius:999px; padding:2px 10px; border:1px solid var(--gold); color:var(--gold)}
.badge.rev{border-color:var(--teal); color:var(--teal)}
.reading p{margin:0; font-size:15px}
.reading .hint{color:var(--teal)}
.empty{color:var(--muted); font-size:15px; margin:0}
.copybox{width:100%; min-height:110px; border-radius:16px; border:1px solid var(--line); background:var(--ink); color:var(--cream); font:14px/1.5 var(--body); padding:12px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--gold); color:var(--ink); font-weight:600; border-radius:999px; padding:10px 20px; z-index:5; box-shadow:0 6px 24px rgba(0,0,0,.4)}
footer{text-align:center; color:var(--muted); font-size:13px}

.shuffle{grid-column:1/-1; position:relative; height:230px; display:flex; align-items:center; justify-content:center; overflow:hidden}
.sc{position:absolute; width:104px; aspect-ratio:2/3; border-radius:12px; border:2px solid var(--gold); background:#1A1738; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.45); animation:riffle 1s ease-in-out infinite; animation-delay:var(--d); will-change:transform}
.sc::before{content:""; position:absolute; inset:6px; border:1px solid rgba(232,193,112,.4); border-radius:8px}
.sc svg{width:52px; height:52px; color:var(--gold)}
.shuffle-msg{position:absolute; bottom:4px; left:0; right:0; text-align:center; font-weight:600; font-size:15px; color:var(--gold); letter-spacing:.04em}
.shuffle-msg i{font-style:normal; animation:blink 1s steps(3,end) infinite}
@keyframes riffle{
  0%{transform:translateX(0) rotate(0)}
  22%{transform:translateX(calc(var(--s)*86px)) rotate(calc(var(--s)*14deg)) translateY(-8px)}
  50%{transform:translateX(0) rotate(0) translateY(0)}
  72%{transform:translateX(calc(var(--s)*-60px)) rotate(calc(var(--s)*-10deg)) translateY(-14px)}
  100%{transform:translateX(0) rotate(0)}
}
@keyframes blink{0%{opacity:.2}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.sc{animation-duration:2.4s}.inner{transition:none}.deal{animation:none}.switch .track,.switch .track::after{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Digitarot</h1>
    <p class="tagline">Tarot Dimana Saja</p>
  </header>

  <section class="panel" aria-label="Pengaturan">
    <div class="row">
      <div>
        <div class="label" id="countLabel">Jumlah kartu</div>
        <div class="sub">1 sampai 12 kartu</div>
      </div>
      <div class="stepper" role="group" aria-labelledby="countLabel">
        <button id="minus" type="button" aria-label="Kurangi satu kartu">−</button>
        <output id="count" aria-live="polite">3</output>
        <button id="plus" type="button" aria-label="Tambah satu kartu">+</button>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Pilihan cepat"></div>
    <button class="switch" id="swRev" type="button" role="switch" aria-checked="true">
      <span><span class="label">Kartu terbalik</span><br><span class="sub">Tiap kartu bisa tegak atau terbalik, peluangnya sama</span></span>
      <span class="track" aria-hidden="true"></span>
    </button>
    <button class="switch" id="swPos" type="button" role="switch" aria-checked="true">
      <span><span class="label">Label posisi</span><br><span class="sub">3 kartu: Situasi, Tantangan, Saran</span></span>
      <span class="track" aria-hidden="true"></span>
    </button>
    <button class="btn primary" id="draw" type="button">Acak dan tarik 3 kartu</button>
  </section>

  <section class="stage" aria-label="Hasil tarikan">
    <div class="spread" id="spread"></div>
    <div class="tools">
      <button class="btn ghost" id="openAll" type="button">Buka semua</button>
      <button class="btn ghost" id="copy" type="button">Salin hasil</button>
    </div>
    <div id="copyWrap" hidden>
      <p class="sub" style="margin:0 0 6px">Salin manual dari kotak ini:</p>
      <textarea class="copybox" id="copyBox" readonly></textarea>
    </div>
  </section>

  <section class="panel reading" aria-label="Bacaan singkat">
    <h2>Bacaan singkat</h2>
    <div id="reading" aria-live="polite"></div>
  </section>

  <footer>Bedaunik App</footer>
</div>
<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="Kartu diperbesar"><div class="zbox"><div id="zbody" style="display:flex; flex-direction:column; align-items:center; gap:14px; width:100%"></div><button class="btn ghost" id="zclose" type="button">Tutup</button></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var ROMAN=['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
  var MAJOR=[
    ['The Fool','awal baru, berani melangkah, spontan'],
    ['The Magician','kemampuan dan niat yang jadi tindakan'],
    ['The High Priestess','intuisi, hal yang belum terlihat'],
    ['The Empress','kelimpahan, merawat, kreativitas'],
    ['The Emperor','struktur, aturan, stabilitas'],
    ['The Hierophant','tradisi, bimbingan, nilai bersama'],
    ['The Lovers','pilihan, hubungan, keselarasan nilai'],
    ['The Chariot','tekad, kemajuan, kendali diri'],
    ['Strength','keberanian lembut, kesabaran'],
    ['The Hermit','merenung, mencari makna'],
    ['Wheel of Fortune','siklus, perubahan, titik balik'],
    ['Justice','keadilan, tanggung jawab, kebenaran'],
    ['The Hanged Man','jeda, sudut pandang baru, melepas'],
    ['Death','akhir satu fase, transformasi'],
    ['Temperance','keseimbangan, moderasi, memadukan'],
    ['The Devil','keterikatan, kebiasaan yang mengikat'],
    ['The Tower','guncangan, kebenaran yang terungkap'],
    ['The Star','harapan, pemulihan, ketenangan'],
    ['The Moon','ilusi, kecemasan, bawah sadar'],
    ['The Sun','kejelasan, sukacita, vitalitas'],
    ['Judgement','evaluasi, panggilan untuk bangkit'],
    ['The World','penyelesaian, keutuhan, pencapaian']
  ];
  var MAJOR_REV=['gegabah, ragu','manipulasi, bakat terbuang','mengabaikan firasat','terlalu bergantung, mandek','kaku, mengontrol','menentang aturan, dogma','tidak selaras, pilihan sulit','kehilangan arah','ragu pada diri sendiri','mengisolasi diri','hambatan, kembali ke pola lama','tidak adil, mengelak tanggung jawab','menunda tanpa alasan','menolak perubahan','berlebihan, tidak seimbang','melepaskan diri','takut perubahan, tertunda','putus asa, kehilangan arah','kebingungan mulai terang','optimisme berlebihan','menghindari introspeksi','belum tuntas'];
  var RANKS=[
    ['Ace','A','awal, benih, peluang'],['Two','2','pilihan, keseimbangan, kemitraan'],['Three','3','pertumbuhan, kerja sama'],
    ['Four','4','stabilitas, jeda, bertahan'],['Five','5','konflik, kehilangan, tantangan'],['Six','6','harmoni, pemulihan, berbagi'],
    ['Seven','7','evaluasi, ujian, kesabaran'],['Eight','8','gerak, usaha, penguasaan'],['Nine','9','hampir selesai, ketahanan'],
    ['Ten','10','penyelesaian, puncak, beban'],['Page','Pg','pelajar, membawa kabar baru'],['Knight','Kn','bergerak, mengejar tujuan'],
    ['Queen','Qn','matang ke dalam, merawat, memahami'],['King','Kg','matang ke luar, memimpin, memutuskan']
  ];
  var SUITS=[
    ['Cups','perasaan dan hubungan','<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M16 18H64L56 44H24Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M40 44V62M28 64H52" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>'],
    ['Pentacles','uang dan pekerjaan','<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="26" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="40" cy="40" r="13" fill="none" stroke="currentColor" stroke-width="4"/></svg>'],
    ['Swords','pikiran dan konflik','<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M40 12V60M26 44H54M40 60V70" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon points="34,20 40,6 46,20" fill="currentColor"/></svg>'],
    ['Wands','semangat dan tindakan','<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M40 20V72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><polygon points="40,4 30,22 50,22" fill="currentColor"/></svg>']
  ];
  var STAR='<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,10 56.1,35.2 78.3,21.7 64.8,43.9 90,50 64.8,56.1 78.3,78.3 56.1,64.8 50,90 43.9,64.8 21.7,78.3 35.2,56.1 10,50 35.2,43.9 21.7,21.7 43.9,35.2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="50" cy="50" r="6" fill="currentColor"/></svg>';

  var DECK=[], i, s, r;
  for(i=0;i<22;i++) DECK.push({major:i, name:MAJOR[i][0], num:ROMAN[i], meaning:MAJOR[i][1], kind:'Major Arcana', rev:MAJOR_REV[i], kw:MAJOR[i][1].split(',')[0], rkw:MAJOR_REV[i].split(',')[0]});
  for(s=0;s<4;s++) for(r=0;r<14;r++){
    DECK.push({suit:s, rank:r, name:RANKS[r][0]+' of '+SUITS[s][0], num:RANKS[r][1], meaning:RANKS[r][2]+', di bidang '+SUITS[s][1], kind:'Minor Arcana, '+SUITS[s][0], kw:RANKS[r][2].split(',')[0], area:SUITS[s][1], suit:s, rank:r});
  }

  /* ---------- Line art: viewBox 0 0 120 150, stroke = currentColor ---------- */
  var PI=Math.PI, FILL=' fill="currentColor" stroke="none"';
  function C(x,y,r,e){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'"'+(e||'')+'/>';}
  function E(x,y,rx,ry,e){return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'"'+(e||'')+'/>';}
  function P(d,e){return '<path d="'+d+'"'+(e||'')+'/>';}
  function Ln(x1,y1,x2,y2){return '<path d="M'+x1+' '+y1+'L'+x2+' '+y2+'"/>';}
  function Rc(x,y,w,h,r){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r||0)+'"/>';}
  function dot(x,y,r){return C(x,y,r||1.3,FILL);}
  function rays(cx,cy,r1,r2,n,rot){var s='',i,a;for(i=0;i<n;i++){a=(rot||0)+i*2*PI/n;s+=Ln((cx+r1*Math.cos(a)).toFixed(1),(cy+r1*Math.sin(a)).toFixed(1),(cx+r2*Math.cos(a)).toFixed(1),(cy+r2*Math.sin(a)).toFixed(1));}return s;}
  function star(cx,cy,r,n,ratio,rot){var pts=[],i,a,rad;rot=(rot===undefined)?-PI/2:rot;for(i=0;i<2*n;i++){a=rot+i*PI/n;rad=i%2===0?r:r*ratio;pts.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1));}return '<polygon points="'+pts.join(' ')+'"/>';}

  function waves(y,x0,x1,amp){var d='M'+x0+' '+y+'q5 -'+amp+' 10 0',x=x0+10;while(x<x1){d+='t10 0';x+=10;}return P(d);}
  function cloud(x,y,s){s=s||1;return P('M'+x+' '+y+'q'+(4*s)+' '+(-8*s)+' '+(12*s)+' '+(-3*s)+'q'+(5*s)+' '+(-8*s)+' '+(13*s)+' '+(2*s)+'q'+(8*s)+' '+(-1*s)+' '+(7*s)+' '+(8*s)+'Z');}
  function hands(x,y){return '';}

    $('count').textContent=state.count;
    $('minus').disabled=state.count<=1; $('plus').disabled=state.count>=12;
    $('draw').textContent='Acak dan tarik '+state.count+' kartu';
    $('swRev').setAttribute('aria-checked',state.rev); $('swPos').setAttribute('aria-checked',state.pos);
    Array.prototype.forEach.call($('chips').children,function(b){ b.setAttribute('aria-pressed', String(Number(b.dataset.n)===state.count)); });
  }
  function renderSpread(animate){
    var L=labels(state.hand.length), html='';
    state.hand.forEach(function(h,k){
      var c=h.card, aria=(L?L[k]+': ':'')+'kartu ke-'+(k+1)+(h.flipped?', '+c.name+(h.rev?', terbalik':', tegak'):', tertutup. Ketuk untuk membuka');
      html+='<div class="slot"><div class="pos">'+(L?esc(L[k]):'')+'</div>'+
        '<button type="button" class="card'+(h.flipped?' flipped':'')+(animate?' deal':'')+'" data-k="'+k+'" aria-label="'+esc(aria)+'"'+(animate?' style="animation-delay:'+(k*70)+'ms"':'')+'>'+
        '<div class="inner"><div class="back">'+STAR.replace('<svg','<svg style="color:var(--gold)"')+'</div>'+
        '<div class="face'+(h.rev?' rev':'')+'">'+faceInner(h)+'</div></div></button>'+
        '<div class="state'+(h.flipped?(h.rev?' rev':' up'):'')+'">'+(h.flipped?(h.rev?'Terbalik':'Tegak'):'Ketuk untuk membuka')+'</div></div>';
    });
    $('spread').innerHTML=html;
  }

  function theme(h){
    var c=h.card;
    var KW2=['awal baru','pilihan','pertumbuhan','stabilitas','konflik','pemulihan','evaluasi','usaha dan penguasaan','hampir selesai','penyelesaian','belajar dan kabar baru','gerak mengejar tujuan','kematangan batin','kepemimpinan'];
    if(c.major!==undefined) return h.rev ? c.kw+' yang sedang tersendat, ditandai '+c.rkw : c.kw;
    return KW2[c.rank]+' dalam urusan '+c.area+(h.rev?' yang masih tersendat':'');
  }
  function summary(){
    var H=state.hand, n=H.length, L=labels(n), txt, k, T=H.map(theme);
    if(n===1){
      txt='Hari ini, kartu mengajak Anda memperhatikan tema '+T[0]+'.';
    } else if(n===3 && L && L[0]==='Situasi'){
      txt='Saat ini, situasi Anda diwarnai tema '+T[0]+'. Tantangannya ada pada '+T[1]+'. Karena itu, kartu menyarankan Anda memperhatikan '+T[2]+'.';
    } else {
      txt='Bacaan ini bermula dari tema '+T[0]+(n>2?', berlanjut ke '+T.slice(1,n-1).join(', lalu '):'')+', dan bermuara pada '+T[n-1]+'.';
    }
    var notes=[], major=0, rev=0, cnt=[0,0,0,0], minor=0;
    H.forEach(function(h){ if(h.card.major!==undefined) major++; else {cnt[h.card.suit]++; minor++;} if(h.rev) rev++; });
    if(n>=3&&major*2>=n) notes.push('Karena banyak kartu Major yang muncul, topik ini terasa besar dan layak diberi perhatian.');
    for(k=0;k<4;k++) if(minor>=3&&cnt[k]*2>=minor) notes.push('Kartu '+SUITS[k][0]+' yang dominan menunjukkan perhatian Anda sedang tertuju pada '+SUITS[k][1]+'.');
    if(n>=3&&rev*2>n) notes.push('Banyaknya kartu terbalik bukan pertanda buruk. Ini lebih terbaca sebagai masa yang penuh hambatan, atau saat yang baik untuk berefleksi.');
    return txt+(notes.length?' '+notes.join(' '):'')+' Cobalah menutupnya dengan satu langkah kecil yang bisa Anda lakukan hari ini.';
  }
  function renderReading(){
    var L=labels(state.hand.length), items='', any=false;
    state.hand.forEach(function(h,k){
      if(!h.flipped) return; any=true;
      var c=h.card;
      items+='<li><div class="top">'+(L?'<span class="pos">'+esc(L[k])+'</span>':'<span class="pos">Kartu '+(k+1)+'</span>')+
        '<span class="nm">'+esc(c.name)+'</span><span class="badge'+(h.rev?' rev':'')+'">'+(h.rev?'Terbalik':'Tegak')+'</span></div>'+
        '<p>'+esc(c.kind)+'. Tema: '+esc(c.meaning)+'.</p>'+
        (h.rev?'<p class="hint">'+(c.rev?'Terbalik: '+esc(c.rev)+'. ':'Terbalik: tema ini tertahan, berlebihan, kurang, atau sedang dihindari. ')+'Tanyakan: energi apa yang tertahan?</p>':'')+'</li>';
    });
    var allOpen=state.hand.length>0&&state.hand.every(function(h){return h.flipped});
    $('reading').innerHTML = any ? '<ol>'+items+'</ol>'+(allOpen?'<div class="sum"><h3>Kalimat kesimpulan</h3><p>'+esc(summary())+'</p></div><p class="tip">Ini draf awal. Ubah dengan kata-kata Anda sendiri agar terasa seperti suara Anda.</p>':'') : '<p class="empty">Ketuk kartu untuk membukanya. Arti singkat tiap kartu muncul di sini.</p>';
  }
  var shuffling=false;
  function shuffleMarkup(){
    var h='',i,sg;
    for(i=0;i<9;i++){ sg=(i%2===0)?1:-1; h+='<div class="sc" style="--s:'+(sg*(0.45+0.07*i)).toFixed(2)+'; --d:'+(-i*0.09).toFixed(2)+'s; z-index:'+i+'">'+STAR+'</div>'; }
    return '<div class="shuffle" role="status" aria-label="Mengacak kartu">'+h+'<div class="shuffle-msg">Mengacak kartu<i>...</i></div></div>';
  }
  function draw(){
    if(shuffling) return; shuffling=true;
    var btn=$('draw'); btn.disabled=true; btn.textContent='Mengacak...';
    $('openAll').disabled=true; $('copy').disabled=true; $('copyWrap').hidden=true;
    $('spread').innerHTML=shuffleMarkup();
    $('reading').innerHTML='<p class="empty">Kartu sedang diacak. Tenangkan pikiran dan fokus pada pertanyaan Anda.</p>';
    setTimeout(function(){
      state.hand=pick(state.count,state.rev);
      shuffling=false; btn.disabled=false; $('openAll').disabled=false; $('copy').disabled=false;
      renderControls(); renderSpread(true); renderReading();
    },3000);
  }
  function flip(k){
    var h=state.hand[k]; if(!h) return; h.flipped=!h.flipped;
    var btn=$('spread').querySelector('.card[data-k="'+k+'"]'); if(!btn){return}
    btn.classList.toggle('flipped',h.flipped); btn.classList.remove('deal');
    var st=btn.parentNode.querySelector('.state');
    st.className='state'+(h.flipped?(h.rev?' rev':' up'):''); st.textContent=h.flipped?(h.rev?'Terbalik':'Tegak'):'Ketuk untuk membuka';
    var L=labels(state.hand.length);
    btn.setAttribute('aria-label',(L?L[k]+': ':'')+'kartu ke-'+(k+1)+(h.flipped?', '+h.card.name+(h.rev?', terbalik':', tegak'):', tertutup. Ketuk untuk membuka'));
    renderReading();
  }
  function toast(msg){
    var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){t.hidden=true},1800);
  }
  function resultText(){
    var L=labels(state.hand.length);
    var t=state.hand.map(function(h,k){
      return (k+1)+'. '+(L?L[k]+': ':'')+h.card.name+' ('+(h.rev?'terbalik':'tegak')+') - '+h.card.meaning;
    }).join('\n');
    return state.hand.every(function(h){return h.flipped}) ? t+'\n\nKesimpulan: '+summary() : t;
  }

  // chips
  [1,3,5,7,10].forEach(function(n){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.n=n; b.textContent=n; b.setAttribute('aria-label',n+' kartu');
    b.addEventListener('click',function(){ state.count=n; save(); renderControls(); });
    $('chips').appendChild(b);
  });
  $('minus').addEventListener('click',function(){ if(state.count>1){state.count--; save(); renderControls();} });
  $('plus').addEventListener('click',function(){ if(state.count<12){state.count++; save(); renderControls();} });
  $('swRev').addEventListener('click',function(){ state.rev=!state.rev; save(); renderControls(); });
  $('swPos').addEventListener('click',function(){ state.pos=!state.pos; save(); renderControls(); if(state.hand.length){renderSpread(false); renderReading();} });
  $('draw').addEventListener('click',draw);
  $('spread').addEventListener('click',function(e){ var b=e.target.closest('.card'); if(!b) return; var k=Number(b.dataset.k); if(state.hand[k].flipped) openZoom(k); else flip(k); });
  var lastFocus=null;
  function openZoom(k){
    var h=state.hand[k], c=h.card, L=labels(state.hand.length); lastFocus=document.activeElement;
    $('zbody').innerHTML='<div class="zoomcard"><div class="face'+(h.rev?' rev':'')+'">'+faceInner(h)+'</div></div><div class="ztext">'+
      '<span class="badge'+(h.rev?' rev':'')+'">'+(h.rev?'Terbalik':'Tegak')+'</span>'+(L?'<div class="sub">'+esc(L[k])+'</div>':'')+
      '<p>Tema: '+esc(c.meaning)+'.</p>'+(h.rev?'<p style="color:var(--teal)">'+(c.rev?'Terbalik: '+esc(c.rev)+'. ':'')+'Tanyakan: energi apa yang tertahan?</p>':'')+'</div>';
    $('zoom').hidden=false; $('zclose').focus();
  }
  function closeZoom(){ $('zoom').hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
  $('zclose').addEventListener('click',closeZoom);
  $('zoom').addEventListener('click',function(e){ if(e.target===$('zoom')) closeZoom(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('zoom').hidden) closeZoom(); });
  $('openAll').addEventListener('click',function(){
    var allOpen=state.hand.every(function(h){return h.flipped});
    state.hand.forEach(function(h,k){ if(allOpen===h.flipped) setTimeout(function(){flip(k)}, k*120); });
  });
  $('copy').addEventListener('click',function(){
    var txt=resultText(), box=$('copyBox');
    function manual(){ box.value=txt; $('copyWrap').hidden=false; box.focus(); box.select(); }
    try{
      navigator.clipboard.writeText(txt).then(function(){ toast('Hasil tersalin'); },manual);
    }catch(e){ manual(); }
  });

  renderControls(); state.hand=pick(state.count,state.rev); renderSpread(true); renderReading();
})();
</script>

</body></html>
